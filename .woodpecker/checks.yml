# Repris de capsule-panic (.woodpecker/checks.yml), plus le SBOM CycloneDX et T17 en version longue.
# Node : l'image officielle node:26 via le proxy Harbor. L'etape build affiche l'empreinte de dist/ :
# le script de publication reconstruit le meme commit et refuse de publier un arbre different.
labels:
  host: tank01

when:
  - event: push
    branch: main
  - event: [pull_request, manual]

steps:
  - name: npm ci
    image: &node harbor.pingfr.duckdns.org/dockerhub/library/node:26
    pull: true
    commands:
      - node --version
      - npm ci
  - name: lint
    image: *node
    commands:
      - npm run lint
  - name: typecheck
    image: *node
    commands:
      - npm run typecheck
  - name: test
    image: *node
    environment:
      T17_RUNS: "1000"
      AI_RUNS: "1000"
    commands:
      - npm test
  - name: build
    image: *node
    commands:
      - npm run build
      - sha256sum dist/index.html
      - echo "empreinte dist $(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)"
  - name: check:precache
    image: *node
    commands:
      - npm run check:precache
  - name: audit
    image: *node
    commands:
      - npm sbom --sbom-format cyclonedx > sbom.json
      - grep -c CycloneDX sbom.json
      - npm audit --audit-level=high
      - npm run check:licenses
  - name: secrets
    image: harbor.pingfr.duckdns.org/dockerhub/zricethezav/gitleaks:v8.30.1
    commands:
      - gitleaks detect --source . --no-banner --redact
